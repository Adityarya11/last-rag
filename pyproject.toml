[project]
name = "last-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "anthropic>=1.14.0",
    "datasets>=5.1.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lancedb>=0.40.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "ruff>=0.17.0",
    "sentence-transformers>=6.1",
    "torch>=2.14",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.19",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }  # embeddinggemma-2's processor imports it

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
